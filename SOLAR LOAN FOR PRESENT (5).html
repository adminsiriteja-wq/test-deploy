const BK={kbank:"kbank",bblbiz:"bbl",bbltf:"bbl",bblpp:"bbl",scbtu:"scb",gsbsfl:"gsb",ghbroof:"ghb",ghbhome:"ghb",smed:"smed",krungsri:"krungsri"};
let lang="th";
try{const s=localStorage.getItem("sld-lang"); if(s==="en"||s==="th")lang=s;}catch(e){}
const $=id=>document.getElementById(id);
const L=()=>UI[lang]; const ix=()=>lang==="th"?0:1;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function fill(sel,opts,keep){const cur=(keep!==undefined&&keep!==null)?keep:sel.value; sel.innerHTML=opts.map(([v,t])=>`<option value="${v}">${esc(t)}</option>`).join(""); if(opts.some(o=>o[0]===cur))sel.value=cur;}
function state(){return{type:$("f-type").value,nat:$("f-nat").value,col:$("f-col").value};}

function hl(text,q){ if(!q)return esc(text); const i=text.toLowerCase().indexOf(q.toLowerCase()); if(i<0)return esc(text); return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length));}
function hay(p){return [p.bank,p.name,p.rate,p.amt,p.term,p.col,p.dl,p.notes[0],p.notes[1]].flat().join(" ").toLowerCase();}

const MTH=[["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."],["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]];
function fmtD(d){const [y,m,dd]=d.slice(0,10).split("-");return `${+dd} ${MTH[ix()][+m-1]} ${y}`;}
function render(){
 const u=L(), i=ix(), q=$("q").value.trim(), st=state();
 const order={yes:0,maybe:1,no:2};
 let list=P.map(p=>{const [s,r]=p.rule(st); return {p,s,r};});
 if(q) list=list.filter(x=>hay(x.p).includes(q.toLowerCase()));
 const BO={kbank:1,bblbiz:2,bbltf:2,bblpp:2,scbtu:3,gsbsfl:4,ghbroof:5,ghbhome:5,smed:6,krungsri:7};
 list.sort((a,b)=>(BO[a.p.id]-BO[b.p.id])||b.p.upd.localeCompare(a.p.upd));
 const c={yes:0,maybe:0,no:0}; list.forEach(x=>c[x.s]++);
 $("tally").innerHTML=`<span class="pill yes">${u.yes} ${c.yes}</span><span class="pill maybe">${u.maybe} ${c.maybe}</span><span class="pill no">${u.no} ${c.no}</span>`;
 $("cards").innerHTML=list.length?list.map(({p,s,r})=>`
  <article class="card ${s==="no"?"no":""}">
   <div class="hd"><img class="logo" src="${LOGO[BK[p.id]]}" alt="${esc(p.bank[i])}">
    <div class="tags">${p.prio?`<span class="pill prio">${u.prio}</span>`:""}${p.isNew?`<span class="pill new">${u.nw}</span>`:""}<span class="pill ${s}">${u[s]}</span></div></div>
   <div><div class="bank">${hl(p.bank[i],q)}</div><h3>${hl(p.name[i],q)}</h3></div>
   <div class="why ${s}">${esc(R[r][i])}</div>
   <dl class="facts"><dt>${u.rate}</dt><dd class="mono">${hl(p.rate[i],q)}</dd><dt>${u.amt}</dt><dd>${hl(p.amt[i],q)}</dd><dt>${u.term}</dt><dd>${hl(p.term[i],q)}</dd><dt>${u.col2}</dt><dd>${hl(p.col[i],q)}</dd><dt>${u.dl}</dt><dd>${hl(p.dl[i],q)}</dd></dl>
   <details ${q?"open":""}><summary>${u.more}</summary><ul>${p.notes[i].map(n=>`<li>${hl(n,q)}</li>`).join("")}</ul></details>
   <div class="upd">${u.upd} ${fmtD(p.upd)}</div>
  </article>`).join(""):`<div class="empty">${u.none}</div>`;
}

function applyLang(){
 const u=L(); document.documentElement.lang=lang;
 $("sub").textContent=u.sub; $("q").placeholder=u.q; $("q").setAttribute("aria-label",u.q);
 ["eb1","h1","p1"].forEach(k=>{const el=$("t-"+k); if(el)el.textContent=u[k];});

 fill($("f-type"),u.types); fill($("f-col"),u.cols); natOpts();
 $("lang-th").setAttribute("aria-pressed",lang==="th"); $("lang-en").setAttribute("aria-pressed",lang==="en");
 render(); if(typeof calcLang==="function")calcLang();
}

$("lang-en").onclick=()=>{lang="en";try{localStorage.setItem("sld-lang",lang)}catch(e){} applyLang();};
$("f-type").onchange=()=>{$("f-nat").value="any"; natOpts(); render();};
$("f-nat").onchange=render; $("f-col").onchange=render; $("q").oninput=render;

/* ---- calculator: rate(y,amt,yrs,M) returns annual % for year y (1-based); M={mlr,mrr} ---- */
const C=[
 {id:"kbank",n:["กสิกรไทย — K-Solar Rooftop","KBank — K-Solar Rooftop"],maxA:null,minT:1,maxT:8,rate:(y,a,t,M)=>t<=5?M.mlr-1:M.mlr-0.8},
 {id:"bblbiz",n:["กรุงเทพ — ธุรกิจสีเขียว (Transition)","Bangkok Bank — Green business (Transition)"],maxA:null,minT:1,maxT:8,rate:(y,a,t,M)=>y<=2?M.mlr-1.25:M.mlr-1},
 {id:"bbltf",n:["กรุงเทพ — Transformation Loan","Bangkok Bank — Transformation Loan"],maxA:null,minT:1,maxT:5,rate:()=>5},
 {id:"bblpp",n:["กรุงเทพ — พูนผลกรีน (Home for Cash, ทำประกัน)","Bangkok Bank — Poonphol Green (Home for Cash, insured)"],maxA:10e6,minT:1,maxT:30,rate:(y,a,t,M)=>y===1?4.99:M.mrr-0.75},
 {id:"scbtu",n:["SCB — Home Loan Top Up (อัตราต่ำสุด)","SCB — Home Loan Top Up (lowest rate)"],maxA:null,minT:1,maxT:30,rate:(y,a,t,M)=>M.mrr-1.5},
 {id:"gsbsfl",n:["ออมสิน — Solar for Life (มีหลักประกัน ดาวน์ 20%)","GSB — Solar for Life (secured, 20% down)"],maxA:1e6,minT:1,maxT:7,rate:(y,a,t,M)=>y<=5?3.25:M.mrr-0.75},

];
const fmt=n=>Math.round(n).toLocaleString("en-US");
function sched(c,amt,yrs,M,own){
 const n=Math.round(yrs*12); let bal=amt, totI=0, rows=[], firstPay=null, sumB=0;
 for(let y=1;y<=Math.ceil(yrs);y++){
  const r=own!=null?own:c.rate(y,amt,yrs,M); const mr=Math.max(r,0)/1200; const left=n-(y-1)*12; if(left<=0)break;
  const pay=mr===0?bal/left:bal*mr/(1-Math.pow(1+mr,-left)); let iy=0;
  for(let m=0;m<12&&m<left;m++){sumB+=bal; const i=bal*mr; iy+=i; bal=bal-(pay-i);} if(bal<0.5)bal=0;
  totI+=iy; if(firstPay===null)firstPay=pay; rows.push([y,r,pay,iy,bal]);
 }
 return {rows,totI,firstPay,avg:sumB>0?totI/(sumB/12)*100:0};
}
function limits(c,amt,yrs){const u=L(),w=[]; if(c.maxA&&amt>c.maxA)w.push(u.overA+" ("+fmt(c.maxA)+")"); if(c.minA&&amt<c.minA)w.push(u.underA+" ("+fmt(c.minA)+")"); if(yrs>c.maxT)w.push(u.overT+" ("+c.maxT+")"); if(yrs<c.minT)w.push(u.underT+" ("+c.minT+")"); return w;}
function calc(){
 const u=L(), i=ix(), amt=+$("c-amt").value||0, yrs=+$("c-yrs").value||0, M={mlr:+$("c-mlr").value||0,mrr:+$("c-mrr").value||0};
 const ownV=$("c-own").value.trim(), own=ownV===""?null:+ownV;
 const c=C.find(x=>x.id===$("c-prod").value)||C[0];
 $("c-head").innerHTML=`<th>${u.yr}</th><th>${u.rt}</th><th>${u.pay}</th><th>${u.intY}</th><th>${u.bal}</th>`;
 const w=limits(c,amt,yrs);
 if(!c.rate&&own==null){$("k-pay").textContent=$("k-int").textContent=$("k-avg").textContent="–";$("c-rows").innerHTML="";$("c-warn").innerHTML=`<div class="warn">${u.norate} — ${esc(u.own)}</div>`;}
 else if(amt<=0||yrs<=0){$("c-rows").innerHTML="";$("c-warn").innerHTML="";}
 else{const r=sched(c,amt,yrs,M,own);
  $("k-pay").textContent=fmt(r.firstPay); $("k-int").textContent=fmt(r.totI); $("k-avg").textContent=r.avg.toFixed(2)+"%";
  $("c-rows").innerHTML=r.rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1].toFixed(2)}%</td><td>${fmt(x[2])}</td><td>${fmt(x[3])}</td><td>${fmt(x[4])}</td></tr>`).join("");
  $("c-warn").innerHTML=w.length?`<div class="warn">⚠️ ${esc(w.join(" · "))}</div>`:"";}
}

 ["eb4","h4","p4"].forEach(k=>$("t-"+k).textContent=u[k]);
 $("l-prod").textContent=u.prod;$("l-amt").textContent=u.camt;$("l-yrs").textContent=u.cyrs;$("l-mlr").textContent=u.mlr;$("l-mrr").textContent=u.mrr;$("l-own").textContent=u.own;$("c-hint").textContent=u.hint;
 $("k-pay-l").textContent=u.kpay;$("k-int-l").textContent=u.kint;$("k-avg-l").textContent=u.kavg;
 fill($("c-prod"),C.map(c=>[c.id,c.n[i]])); calc();}
["c-prod","c-amt","c-yrs","c-mlr","c-mrr","c-own"].forEach(id=>$(id).addEventListener("input",calc));
